services:
  zookeeper:
    build: .
    image: hbase-cluster:3.0.0
    container_name: zk1
    hostname: zk1
    command:
      - bash
      - -lc
      - |
        echo 1 > /data/zookeeper/myid
        exec /opt/zookeeper/bin/zkServer.sh start-foreground
    ports:
      - "2181:2181"
      - "2888:2888"
      - "3888:3888"
    volumes:
      - zk1_data:/data/zookeeper
      - ./config/zoo.cfg:/opt/zookeeper/conf/zoo.cfg:ro
    restart: unless-stopped
    extra_hosts:
      - "maquina1:100.80.31.21"
      - "maquina2:100.76.200.127"
      - "maquina3:100.122.222.2"

  namenode:
    image: hbase-cluster:3.0.0
    build: .
    container_name: hdfs-nn
    hostname: hdfs-nn
    command: ["hdfs", "namenode"]
    ports:
      - "8020:8020"
      - "9870:9870"
    volumes:
      - nn_data:/data/hadoop/nn
      - hadoop_tmp:/data/hadoop/tmp
      - ./config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    restart: unless-stopped
    extra_hosts:
      - "maquina1:100.80.31.21"
      - "maquina2:100.76.200.127"
      - "maquina3:100.122.222.2"

  datanode:
    image: hbase-cluster:3.0.0
    container_name: hdfs-dn1
    hostname: hdfs-dn1
    command: ["hdfs", "datanode"]
    ports:
      - "9866:9866"
      - "9864:9864"
      - "9090:9090"
    volumes:
      - dn1_data:/data/hadoop/dn
      - hadoop_tmp:/data/hadoop/tmp
      - ./config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    depends_on:
      - namenode
    restart: unless-stopped
    extra_hosts:
      - "maquina1:100.80.31.21"
      - "maquina2:100.76.200.127"
      - "maquina3:100.122.222.2"

  hmaster:
    image: hbase-cluster:3.0.0
    container_name: hbase-master
    hostname: hbase-master
    command:
      - bash
      - -lc
      - exec /opt/hbase/bin/hbase master start
    ports:
      - "16000:16000"
      - "16010:16010"
    volumes:
      - ./config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./config/core-site.xml:/opt/hbase/conf/core-site.xml:ro
      - ./config/hdfs-site.xml:/opt/hbase/conf/hdfs-site.xml:ro
      - ./config/hbase-site.xml:/opt/hbase/conf/hbase-site.xml:ro
    depends_on:
      - namenode
      - zookeeper
    restart: unless-stopped
    extra_hosts:
      - "maquina1:100.80.31.21"
      - "maquina2:100.76.200.127"
      - "maquina3:100.122.222.2"

volumes:
  zk1_data:
  nn_data:
  dn1_data:
  hadoop_tmp: