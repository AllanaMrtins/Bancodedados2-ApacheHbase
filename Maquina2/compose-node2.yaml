services:
  zookeeper:
    image: hbase-cluster:3.0.0
    container_name: zookeeper-2
    hostname: 100.76.200.127
    restart: unless-stopped
    command:
      - bash
      - -lc
      - |
        echo 2 > /data/zookeeper/myid
        exec /opt/zookeeper/bin/zkServer.sh start-foreground
    ports:
      - "2181:2181"
      - "2888:2888"
      - "3888:3888"
    volumes:
      - zk2_data:/data/zookeeper
      - ./config/zoo.cfg:/opt/zookeeper/conf/zoo.cfg:ro

  datanode:
    image: hbase-cluster:3.0.0
    container_name: hdfs-dn2
    hostname: 100.76.200.127
    restart: unless-stopped
    command: ["hdfs", "datanode"]
    ports:
      - "9866:9866"
      - "9864:9864"
    volumes:
      - dn2_data:/data/hadoop/dn
      - hadoop_tmp2:/data/hadoop/tmp
      - ./config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro

  regionserver:
    image: hbase-cluster:3.0.0
    container_name: hbase-regionserver-2
    hostname: 100.76.200.127
    restart: unless-stopped
    command: ["hbase", "regionserver", "start"]
    ports:
      - "16020:16020"
      - "16030:16030"
    volumes:
      - ./config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./config/core-site.xml:/opt/hbase/conf/core-site.xml:ro
      - ./config/hdfs-site.xml:/opt/hbase/conf/hdfs-site.xml:ro
      - ./config/hbase-site.xml:/opt/hbase/conf/hbase-site.xml:ro
    depends_on:
      - datanode
      - zookeeper

volumes:
  zk2_data:
  dn2_data:
  hadoop_tmp2: